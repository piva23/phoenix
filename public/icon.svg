<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a24"/>
      <stop offset="100%" style="stop-color:#0C0C10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="128" x2="512" y2="128" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="128" y1="0" x2="128" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="384" y1="0" x2="384" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Letter P -->
  <text x="256" y="340" font-size="300" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-weight="900" filter="url(#glow)">P</text>
  <!-- Small accent dot -->
  <circle cx="370" cy="140" r="16" fill="#10B981" opacity="0.9"/>
</svg>
